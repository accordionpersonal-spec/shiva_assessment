bundle:
  name: shiva_assessment

variables:
  catalog:
    description: "Catalog per environment"
  schema:
    description: "Schema name"
    default: "gold"

targets:
  # DEVELOPMENT: Your personal sandbox
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-effc4163-c9de.cloud.databricks.com
      root_path: /Workspace/Users/accordionpersonal@gmail.com/.bundle/${bundle.name}/dev
    variables:
      catalog: my_assessment
      schema: gold

  # UAT: User Acceptance Testing (for stakeholders)
  uat:
    mode: production
    workspace:
      host: https://dbc-effc4163-c9de.cloud.databricks.com
      root_path: /Workspace/Users/accordionpersonal@gmail.com/.bundle/${bundle.name}/uat
    variables:
      catalog: my_assessment_uat
      schema: gold

  # PRODUCTION: The real deal
  prod:
    mode: production
    workspace:
      host: https://dbc-effc4163-c9de.cloud.databricks.com
      root_path: /Workspace/Users/accordionpersonal@gmail.com/.bundle/${bundle.name}/prod
    variables:
      catalog: my_assessment_prod
      schema: gold