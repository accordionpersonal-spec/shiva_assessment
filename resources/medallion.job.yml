resources:
  jobs:
    shiva_assessment_job:
      name: shiva_assessment_job
      job_clusters:
        - job_cluster_key: assessment_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1

      tasks:
        - task_key: bronze_task
          job_cluster_key: assessment_cluster
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: "bronze"
            source: WORKSPACE

        - task_key: silver_task
          job_cluster_key: assessment_cluster
          depends_on:
            - task_key: bronze_task
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: "silver"
            source: WORKSPACE

        - task_key: gold_task
          job_cluster_key: assessment_cluster
          depends_on:
            - task_key: silver_task
          notebook_task:
            notebook_path: ../src/03_gold_transformation.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: ${var.schema}
            source: WORKSPACE

      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED