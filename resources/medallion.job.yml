resources:
  jobs:
    shiva_assessment_job:
      name: shiva_assessment_job
      tasks:
        - task_key: bronze_task
          notebook_task:
            notebook_path: ../src/01_bronze.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: "bronze"

        - task_key: silver_task
          depends_on:
            - task_key: bronze_task
          notebook_task:
            notebook_path: ../src/02_silver.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: "silver"

        - task_key: gold_task
          depends_on:
            - task_key: silver_task
          notebook_task:
            notebook_path: ../src/03_gold.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: ${var.schema} # Uses the "gold" default from databricks.yml

      job_clusters:
        - job_cluster_key: assessment_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1

