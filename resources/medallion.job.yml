resources:
  jobs:
    shiva_assessment_job:
      name: shiva_assessment_job

      tasks:
        - task_key: bronze_task
          notebook_task:
            notebook_path: ../src/01_bronze_ingestion.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: "bronze"
            source: WORKSPACE

        - task_key: silver_task
          depends_on:
            - task_key: bronze_task
          notebook_task:
            notebook_path: ../src/02_silver_cleaning.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: "silver"
            source: WORKSPACE

        - task_key: gold_task
          depends_on:
            - task_key: silver_task
          notebook_task:
            notebook_path: ../src/03_gold_transformation.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
              schema_param: ${var.schema}
            source: WORKSPACE

        - task_key: spark_optimization_task
          depends_on:
            - task_key: gold_task
          notebook_task:
            notebook_path: ../src/04_spark_optimization.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
            source: WORKSPACE
            
        - task_key: delta_optimization_task
          depends_on:
            - task_key: spark_optimization_task
          notebook_task:
            notebook_path: ../src/05_delta_optimization.ipynb
            base_parameters:
              catalog_param: ${var.catalog}
            source: WORKSPACE

      queue:
        enabled: true